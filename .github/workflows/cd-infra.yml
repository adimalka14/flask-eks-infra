name: CD - Infrastructure

on:
  push:
    branches: [main]

concurrency:
  group: terraform-state
  cancel-in-progress: false

env:
  TF_VAR_grafana_password: ${{ secrets.GRAFANA_PASSWORD }}

jobs:
  plan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    outputs:
      destroy_count: ${{ steps.parse.outputs.destroy_count }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        id: parse
        run: |
          terraform plan -out=tfplan 2>&1 | tee plan_output.txt
          DESTROY=$(grep -oP '\d+(?= to destroy)' plan_output.txt || echo "0")
          echo "destroy_count=$DESTROY" >> $GITHUB_OUTPUT

      - name: Upload plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: terraform/tfplan

  auto-apply:
    needs: plan
    if: needs.plan.outputs.destroy_count == '0'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: terraform
      - run: terraform apply -auto-approve tfplan

  manual-apply:
    needs: plan
    if: needs.plan.outputs.destroy_count != '0'
    environment: production
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: terraform
      - run: terraform apply tfplan